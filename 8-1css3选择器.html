<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css3</title>
    <style>
        .main{
            display: flex;
            flex-wrap: wrap;
            margin: 10px;
        }
        .box{
            width: 150px;
            height: 150px;
            border: 1px solid #ccc;
            margin: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            transition: all 0.6s;
            box-sizing: border-box;
        }
        .box:first-child:hover{
            background: red;
            color:white;
            font-size: 140px;
        }
        .box:nth-child(2):hover{
            border-radius: 50%;
            border-width: 10px;
        }
        .box:nth-child(3):hover{
            box-shadow: 10px 10px 10px #ccc;
        }
        .box:nth-of-type(4):hover{
            text-shadow: 100px 5px 5px #ccc;
        }
        .box:nth-of-type(5):hover{
            background: linear-gradient(45deg,red,yellow,pink);
        }
        .box:nth-of-type(5)+.box{
            background: radial-gradient(red,yellow,pink);
        }
        .box:nth-of-type(7)+.box{
            transform:scale(0.5)
        }
        .box:nth-child(8):hover{
            transform:translateX(-150px);
        }
        .box:nth-child(9):hover{
            transform:rotate(-180deg)
        }
        .box:nth-child(10):hover{
            transform:skewX(20deg) translateY(50px);
        }
        .box:nth-last-child(2):hover::before{
            content: "*";
            color: red;
        }
        .box:nth-child(3n):hover{
            border:3px solid red;
        }

        /* =====偶数盒子hover效果，去掉旋转，改为上移+渐变边框+阴影===== */
        .box:nth-child(even):hover{
            transform: translateY(-8px) scale(1.05);
            border:3px solid #3498db;
            box-shadow: 0 10px 18px rgba(52,152,219,0.3);
        }

        /* 第12个盒子，优先级更高，保留齐英伊效果，同步偶数上移效果 */
        .box:nth-child(12):hover{
            background-color: #222;
            color: transparent;
            transform: translateY(-8px) scale(1.05);
            border:3px solid #3498db;
            box-shadow: 0 10px 18px rgba(52,152,219,0.3);
        }
        .box:nth-child(12):hover::before{
            content: "齐英伊";
            position: absolute;
            font-size: 14px;
            color: #fff;
            letter-spacing: 2px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
    </div>
</body>
</html>
