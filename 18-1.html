<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>18-1 Canvas 粒子文字 · 齐英伊829</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: #0a0a1e;
            color: #e2e8f0;
            position: relative;
        }
        #qyy_canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .qyy_head {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        .qyy_head h1 {
            font-size: 1.1rem;
            font-weight: normal;
            color: #c4b5fd;
            letter-spacing: 3px;
        }
        .qyy_head .qyy_sub {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 4px;
        }
        .qyy_controls {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 10;
        }
        .qyy_btn {
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid rgba(196, 181, 253, 0.4);
            color: #c4b5fd;
            padding: 7px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(8px);
        }
        .qyy_btn:hover {
            background: rgba(102, 126, 234, 0.4);
            border-color: #c4b5fd;
            color: #fff;
        }
        .qyy_btn.qyy_btn--on {
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-color: transparent;
            color: #fff;
        }
        .qyy_name-tag {
            position: absolute;
            bottom: 24px;
            right: 24px;
            font-size: 0.72rem;
            color: #475569;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <canvas id="qyy_canvas"></canvas>

    <div class="qyy_head">
        <h1>CANVAS · 粒子汇聚成字</h1>
        <p class="qyy_sub">移动鼠标与粒子互动 · 松手自动回到文字</p>
    </div>

    <div class="qyy_controls">
        <button class="qyy_btn qyy_btn--on" onclick="qyy_switch('齐英伊', this)">齐英伊</button>
        <button class="qyy_btn" onclick="qyy_switch('WELCOME', this)">WELCOME</button>
        <button class="qyy_btn" onclick="qyy_switch('我爱你', this)">我爱你</button>
        <button class="qyy_btn" onclick="qyy_switch('加油！', this)">加油！</button>
    </div>

    <div class="qyy_name-tag">齐英伊 · 24001010829</div>

    <script>
        const qyy_canvas = document.getElementById('qyy_canvas');
        const qyy_ctx = qyy_canvas.getContext('2d');
        let qyy_w, qyy_h, qyy_dpr;

        function qyy_resize() {
            qyy_dpr = window.devicePixelRatio || 1;
            qyy_w = qyy_canvas.clientWidth;
            qyy_h = qyy_canvas.clientHeight;
            qyy_canvas.width = qyy_w * qyy_dpr;
            qyy_canvas.height = qyy_h * qyy_dpr;
            qyy_ctx.setTransform(qyy_dpr, 0, 0, qyy_dpr, 0, 0);
            if (qyy_text) qyy_build(qyy_text);
        }
        window.addEventListener('resize', qyy_resize);

        // ===== 单粒子对象 =====
        function qyy_P(qyy_tx, qyy_ty) {
            this.tx = qyy_tx;   // 目标位置（字上的点）
            this.ty = qyy_ty;
            this.x  = qyy_tx + (Math.random() - 0.5) * 30;   // 初始位置：离目标点很近
            this.y  = qyy_ty + (Math.random() - 0.5) * 30;
            this.vx = 0;
            this.vy = 0;
            this.color = '#c4b5fd';
        }

        let qyy_particles = [];
        let qyy_text = '齐英伊';

        // ===== 从文字采样目标点 =====
        function qyy_sample(qyy_t) {
            const qyy_off = document.createElement('canvas');
            const qyy_o = qyy_off.getContext('2d');
            qyy_off.width = qyy_w;
            qyy_off.height = qyy_h;
            qyy_o.fillStyle = '#000';
            qyy_o.fillRect(0, 0, qyy_w, qyy_h);

            // 字号：尽量大
            const qyy_fs = Math.min(qyy_w / qyy_t.length * 1.4, qyy_h * 0.55);
            qyy_o.fillStyle = '#fff';
            qyy_o.textAlign = 'center';
            qyy_o.textBaseline = 'middle';
            qyy_o.font = 'bold ' + qyy_fs + 'px "Microsoft YaHei", "SimHei", Arial, sans-serif';
            qyy_o.fillText(qyy_t, qyy_w / 2, qyy_h / 2);

            const qyy_img = qyy_o.getImageData(0, 0, qyy_w, qyy_h).data;
            const qyy_out = [];
            const qyy_step = 3;
            for (let y = 20; y < qyy_h - 20; y += qyy_step) {
                for (let x = 20; x < qyy_w - 20; x += qyy_step) {
                    if (qyy_img[(y * qyy_w + x) * 4 + 3] > 128) {
                        qyy_out.push({ x: x, y: y });
                    }
                }
            }
            return qyy_out;
        }

        // ===== 构建粒子数组 =====
        function qyy_build(qyy_t) {
            qyy_text = qyy_t;
            const qyy_pts = qyy_sample(qyy_t);
            console.log('构建「' + qyy_t + '」：' + qyy_pts.length + ' 个点');

            const qyy_pal = ['#a78bfa', '#c4b5fd', '#818cf8', '#e0e7ff', '#f0abfc', '#f9a8d4'];

            // 数量对齐
            if (qyy_particles.length > qyy_pts.length) {
                qyy_particles.length = qyy_pts.length;
            }
            while (qyy_particles.length < qyy_pts.length) {
                qyy_particles.push(new qyy_P(0, 0));
            }

            for (let i = 0; i < qyy_pts.length; i++) {
                const p = qyy_particles[i];
                p.tx = qyy_pts[i].x;
                p.ty = qyy_pts[i].y;
                p.color = qyy_pal[i % qyy_pal.length];
            }
        }

        // ===== 鼠标 =====
        let qyy_m = { x: -9999, y: -9999, on: false };
        qyy_canvas.addEventListener('mousemove', function (e) {
            const r = qyy_canvas.getBoundingClientRect();
            qyy_m.x = e.clientX - r.left;
            qyy_m.y = e.clientY - r.top;
            qyy_m.on = true;
        });
        qyy_canvas.addEventListener('mouseleave', function () { qyy_m.on = false; });
        qyy_canvas.addEventListener('touchmove', function (e) {
            e.preventDefault();
            const r = qyy_canvas.getBoundingClientRect();
            const t = e.touches[0];
            qyy_m.x = t.clientX - r.left;
            qyy_m.y = t.clientY - r.top;
            qyy_m.on = true;
        }, { passive: false });
        qyy_canvas.addEventListener('touchend', function () { qyy_m.on = false; });

        // ===== 动画循环 =====
        function qyy_loop() {
            // 完全清空，保证字清晰
            qyy_ctx.fillStyle = '#0a0a1e';
            qyy_ctx.fillRect(0, 0, qyy_w, qyy_h);

            const qyy_k = 0.15;     // 弹簧系数
            const qyy_b = 0.85;     // 阻尼
            const qyy_R = 150;      // 鼠标排斥半径

            for (let i = 0; i < qyy_particles.length; i++) {
                const p = qyy_particles[i];

                // 弹簧力
                p.vx += (p.tx - p.x) * qyy_k;
                p.vy += (p.ty - p.y) * qyy_k;

                // 鼠标排斥
                if (qyy_m.on) {
                    const dx = p.x - qyy_m.x;
                    const dy = p.y - qyy_m.y;
                    const d2 = dx * dx + dy * dy;
                    if (d2 < qyy_R * qyy_R) {
                        const d = Math.sqrt(d2) || 1;
                        const f = (qyy_R - d) / qyy_R * 5;
                        p.vx += dx / d * f;
                        p.vy += dy / d * f;
                    }
                }

                p.vx *= qyy_b;
                p.vy *= qyy_b;
                p.x += p.vx;
                p.y += p.vy;

                // 极近直接吸附归零
                const ddx = p.tx - p.x, ddy = p.ty - p.y;
                if (ddx * ddx + ddy * ddy < 0.4) {
                    p.x = p.tx; p.y = p.ty; p.vx = 0; p.vy = 0;
                }

                // 画粒子（大方块，更醒目）
                qyy_ctx.fillStyle = p.color;
                qyy_ctx.fillRect(Math.round(p.x) - 1, Math.round(p.y) - 1, 3, 3);
            }

            requestAnimationFrame(qyy_loop);
        }

        function qyy_switch(qyy_t, qyy_el) {
            document.querySelectorAll('.qyy_btn').forEach(function (b) { b.classList.remove('qyy_btn--on'); });
            qyy_el.classList.add('qyy_btn--on');
            qyy_build(qyy_t);
        }

        // ===== 启动 =====
        qyy_resize();
        qyy_build('齐英伊');
        requestAnimationFrame(qyy_loop);

        console.log('===== 18-1 Canvas 粒子文字 =====');
    </script>
</body>
</html>
