<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>829齐英伊</title>
</head>
<body>
    <h2>表单form</h2>
    <form>
        <p>用户名:<input type="text" name="username" placeholder="请输入用户名"></p>
        <p>密码:<input type="password" name="password" placeholder="请输入密码"></p>
        <p>性别:
            <input type="radio" name="sex" value="male">男
            <input type="radio" name="sex" value="female" checked>女
            <input type="radio" name="sex" value="secret">保密
        </p>
        <p>爱好：
            <input type="checkbox" name="hobby" value="sports">运动
            <input type="checkbox" name="hobby" value="music">音乐
            <input type="checkbox" name="hobby" value="reading">阅读
            <input type="checkbox" name="hobby" value="travel">旅行
            <input type="checkbox" name="hobby" value="game">游戏
            <input type="checkbox" name="hobby" value="other">其他
        </p>
        <p>籍贯：
            <select name="birthplace">
                <option value="北京">北京</option>
                <option value="天津">天津</option>
                <option value="河北">河北</option>
                <option value="山西">山西</option>
                <option value="内蒙古">内蒙古</option>
                <option value="辽宁" selected>辽宁</option>
                <option value="吉林">吉林</option>
                <option value="黑龙江">黑龙江</option>
            </select>
        </p>
        <p>个人介绍：
            <textarea name="introduction" placeholder="请输入个人介绍" cols="30" rows="10"></textarea>
        </p>
        <p>出生日期：
            <input type="date" name="birthday"></input>
        </p>
        <p>上传文件：
            <input type="file" name="file" multiple>
        </p>
        <p>
            <input type="button" value="普通按钮">
            <input type="submit" value="提交按钮">
            <input type="reset" value="重置按钮"></input>
            </input>
            </input>
        </p>
    </form>
    <button>按钮</button>

</body>
</html>
