<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10-3 响应式全屏盒子</title>
  <style>
    :root {
      font-size: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff4d6d, #ff9f1c, #38bdf8, #34d399);
      background-size: 300% 300%;
      animation: bgMove 10s ease-in-out infinite;
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }

    .full-box {
      width: 100vw;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      background: rgba(0, 0, 0, 0.18);
    }

    .content {
      width: 80vw;
      max-width: 54rem;
      min-height: 22rem;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: rgba(0, 0, 0, 0.3);
      border: 0.125rem solid rgba(255, 255, 255, 0.8);
      color: #fff;
      box-shadow: 0 1rem 2.5rem rgba(0, 0, 0, 0.2);
    }

    .content h1 {
      font-size: clamp(2.5rem, 5vw, 6rem);
      letter-spacing: 0.35rem;
      line-height: 1.2;
      text-shadow: 0 0.25rem 0.75rem rgba(0, 0, 0, 0.3);
    }

    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @media (max-width: 900px) {
      body {
        background: linear-gradient(135deg, #6d28d9, #2563eb, #06b6d4, #f59e0b);
        background-size: 250% 250%;
      }

      .content {
        width: 88vw;
        min-height: 16rem;
      }

      .content h1 {
        font-size: clamp(2rem, 7vw, 4rem);
        letter-spacing: 0.2rem;
      }
    }

    @media (max-width: 600px) {
      :root {
        font-size: 14px;
      }

      body {
        background: linear-gradient(135deg, #111827, #1d4ed8, #0891b2, #f97316);
        background-size: 250% 250%;
      }

      .full-box {
        padding: 1rem;
      }

      .content {
        width: 92vw;
        min-height: 12rem;
      }

      .content h1 {
        font-size: clamp(1.5rem, 8vw, 2.6rem);
        letter-spacing: 0.12rem;
      }
    }

    @media (max-width: 360px) {
      :root {
        font-size: 12px;
      }

      body {
        background: linear-gradient(135deg, #0f172a, #7c2d12, #f59e0b, #38bdf8);
        background-size: 260% 260%;
      }

      .content h1 {
        font-size: 1.8rem;
        letter-spacing: 0.06rem;
      }
    }
  </style>
</head>
<body>
  <div class="full-box">
    <div class="content">
      <h1>齐英伊</h1>
    </div>
  </div>
</body>
</html>
