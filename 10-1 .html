<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS 颜色动画盒子</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f3f4f6;
    }

    .box {
      width: 260px;
      height: 180px;
      border-radius: 20px;
      position: relative;
      box-shadow: 0 18px 35px rgba(0, 0, 0, 0.18);
      animation:
        colorChange 8s ease-in-out infinite,
        floatMove 2.4s ease-in-out infinite,
        swingMove 4s ease-in-out infinite,
        scaleMove 3s ease-in-out infinite;
    }

    .box::before {
      content: "";
      position: absolute;
      inset: -14px;
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.35);
      filter: blur(18px);
      z-index: -1;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes colorChange {
      0% { background-color: #ff6b6b; }
      25% { background-color: #feca57; }
      50% { background-color: #48dbfb; }
      75% { background-color: #1dd1a1; }
      100% { background-color: #ff6b6b; }
    }

    @keyframes floatMove {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-18px); }
    }

    @keyframes swingMove {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(8deg); }
      50% { transform: rotate(-8deg); }
      75% { transform: rotate(4deg); }
    }

    @keyframes scaleMove {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    @keyframes glow {
      from {
        opacity: 0.6;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1.08);
      }
    }
  </style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
